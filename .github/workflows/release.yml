# Publishes to PyPI through Trusted Publishing: PyPI hands out a short-lived
# upload token to this workflow, so no API token is stored anywhere. The
# publisher registered on PyPI names this file and the environment below —
# rename either and the upload stops working.
name: Release

on:
  release:
    types: [published]

permissions: {}

jobs:
  pypi:
    name: Build and publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      # The one permission Trusted Publishing needs: it lets the job ask
      # GitHub for the signed token that proves which workflow is running.
      id-token: write

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      # Deliberately not pixi: the development environment installs the
      # neighbouring ytlounge checkout by path, which does not exist on a
      # runner that only checks out this repository. The release build does
      # not need it — hatchling builds from pyproject.toml alone.
      - name: Tag matches the version in pyproject.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python -c 'import tomllib, pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          echo "tag=$tag  pyproject=$version"
          test "$tag" = "$version"

      # Wheel and sdist into dist/, then the same metadata check PyPI runs.
      - name: Build and validate
        run: |
          pipx run build
          pipx run twine check dist/*

      - uses: pypa/gh-action-pypi-publish@v1.14.2
